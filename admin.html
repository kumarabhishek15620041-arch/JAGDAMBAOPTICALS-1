<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jagdamba Optical Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="auth"><div class="box"><h1>👑 Jagdamba Optical</h1><p>Admin Panel</p><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg"></p></div></div>
<div id="app" class="hidden"><aside><h2>👑 Jagdamba</h2><button onclick="show('dashboard')">Dashboard</button><button onclick="show('products')">Products</button><button onclick="show('enquiries')">Enquiries</button><button onclick="show('settings')">Store Settings</button><a href="index.html" target="_blank">View Website</a><button onclick="logout()">Logout</button></aside><main>
<section id="dashboard"><h1>Dashboard</h1><div class="stats"><div><b id="statProducts">0</b><span>Active Products</span></div><div><b id="statEnquiries">0</b><span>Total Enquiries</span></div><div><b id="statNew">0</b><span>New Enquiries</span></div></div></section>
<section id="products" class="hidden"><div class="head"><h1>Products</h1><button onclick="newProduct()">+ Add Product</button></div><div id="productList"></div></section>
<section id="enquiries" class="hidden"><h1>Enquiries</h1><div id="enquiryList"></div></section>
<section id="settings" class="hidden"><h1>Store Settings</h1><form id="settingsForm" class="form"><input name="storeName" placeholder="Store name"><input name="phone" placeholder="Phone"><input name="whatsapp" placeholder="WhatsApp number, e.g. 919876543210"><input name="email" placeholder="Email"><input name="address" placeholder="Address"><input name="state" placeholder="State"><input name="hours" placeholder="Opening hours"><input name="heroTitle" placeholder="Hero title"><button>Save Settings</button></form><p id="saveMsg"></p></section>
</main></div><div id="modal" class="modal hidden"><div class="modalbox"><h2 id="modalTitle">Product</h2><form id="productForm" class="form"><input name="name" placeholder="Frame name" required><select name="type"><option>Full Rim</option><option>Half Rim</option><option>Rimless</option><option>Round</option><option>Rectangle</option><option>Cat Eye</option></select><select name="cat"><option>Men</option><option>Women</option><option>Kids</option><option>Unisex</option></select><input name="price" type="number" placeholder="Price" required><input name="image" placeholder="Image URL (optional)"><input name="icon" placeholder="Icon" value="👓"><input name="size" placeholder="Size" value="52-18-140"><textarea name="description" placeholder="Description"></textarea><div><button>Save</button><button type="button" onclick="closeModal()">Cancel</button></div></form></div></div><script src="admin.js"></script></body></html>
